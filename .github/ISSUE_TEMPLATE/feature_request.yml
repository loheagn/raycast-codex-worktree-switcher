name: Feature request
description: Suggest an improvement to the extension.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Codex Worktree Switcher.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this feature address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List any workarounds or alternative designs you considered.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request is about switching local Codex Desktop Git checkouts in Raycast and Zed.
          required: true
